# SermonROAD Windows 빌드 서버
# main 에 엔진 · 버전 · Windows 스크립트가 바뀌면, 실제 Windows 에서 SermonROAD.exe 를 만들고 여러 상황을 시험해요.
# 결과(빌드 기록 · 시험 결과 · 스크린샷)는 ci-results-win 브랜치에 올라가요. (배포용 exe 는 리눅스에서 scripts/build-win.sh 로 만들어요)
name: build-win
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'engine/**'
      - 'scripts/build-win.sh'
      - 'scripts/ci-win.sh'
      - 'scripts/smoke-win.py'
      - 'scripts/testdata/**'
      - '.github/workflows/build-win.yml'
permissions:
  contents: write
concurrency:
  group: build-win
  cancel-in-progress: true
jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Korean OCR language (for scanned PDFs)
        continue-on-error: true
        timeout-minutes: 12
        shell: pwsh
        run: |
          Get-WindowsCapability -Online -Name "Language.OCR*ko*" | Format-Table Name,State
          Add-WindowsCapability -Online -Name "Language.OCR~~~ko-KR~0.0.1.0" | Format-Table
      - name: Build, test on real Windows, publish results
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-win.sh
